name: Deploy Emmy runner to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore optimized runner
        id: runner-bundle
        uses: actions/cache@v5
        with:
          path: emmy-runner/public/js
          key: emmy-runner-release-v1-${{ runner.os }}-${{ hashFiles('emmy-runner/src/**/*.cljs', 'emmy-runner/deps.edn', 'emmy-runner/shadow-cljs.edn', 'emmy-runner/package.json', 'emmy-runner/package-lock.json') }}

      - name: Set up Java
        if: steps.runner-bundle.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        if: steps.runner-bundle.outputs.cache-hit != 'true'
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.5.1654

      - name: Cache Clojure dependencies
        if: steps.runner-bundle.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
            emmy-runner/.cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', 'emmy-runner/deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: emmy-runner/package-lock.json

      - name: Stage generated files from the current successful build
        working-directory: emmy-runner
        run: npm run sync-generated

      - name: Install JavaScript dependencies
        if: steps.runner-bundle.outputs.cache-hit != 'true'
        working-directory: emmy-runner
        run: npm ci

      - name: Build optimized runner
        if: steps.runner-bundle.outputs.cache-hit != 'true'
        working-directory: emmy-runner
        run: npm run build

      - name: Check runner bundle
        run: test -s emmy-runner/public/js/main.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: emmy-runner/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
